name: Weekly template update assessment

on:
  schedule:
    # Every Friday at 07:00 UTC
    - cron: "0 7 * * 5"
  workflow_dispatch:
    inputs:
      only:
        description: "Assess only templates whose name contains this text (optional)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: template-assessment
  cancel-in-progress: false

jobs:
  assess:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --quiet pyyaml

      - name: Assess upstream projects
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional. When set, security and deployer-impact signals come from
          # TypeSafe Jev instead of keyword regexes (scripts/judgments.py).
          # A whole run is well under $1; without the secret the heuristics run.
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          # Passed through the environment rather than interpolated into the
          # script below. A ${{ }} expression inside run: is substituted before
          # the shell parses the line, so a crafted dispatch input would run as
          # shell with this job's contents:write token.
          ONLY: ${{ github.event.inputs.only }}
        run: |
          set -euo pipefail
          extra=()
          if [ -n "${ONLY:-}" ]; then
            extra+=(--only "$ONLY")
          fi
          python scripts/assess_template_updates.py --report-dir reports --cache-dir "$RUNNER_TEMP/assessment-cache" "${extra[@]}"

      - name: Commit the report
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports
          if git diff --cached --quiet; then
            echo "No report changes to commit."
            exit 0
          fi
          date="$(date -u +%F)"
          git commit -m "Template update assessment ${date}"
          git push origin "HEAD:$DEFAULT_BRANCH"
