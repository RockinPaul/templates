name: Weekly template update assessment

on:
  schedule:
    # Every Friday at 07:00 UTC
    - cron: "0 7 * * 5"
  workflow_dispatch:
    inputs:
      only:
        description: "Assess only templates whose name contains this text (optional)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: template-assessment
  cancel-in-progress: false

jobs:
  assess:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --quiet pyyaml

      - name: Assess upstream projects
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          extra=()
          if [ -n "${{ github.event.inputs.only }}" ]; then
            extra+=(--only "${{ github.event.inputs.only }}")
          fi
          python scripts/assess_template_updates.py --report-dir reports --cache-dir "$RUNNER_TEMP/assessment-cache" "${extra[@]}"

      - name: Commit the report
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports
          if git diff --cached --quiet; then
            echo "No report changes to commit."
            exit 0
          fi
          date="$(date -u +%F)"
          git commit -m "Template update assessment ${date}"
          git push origin HEAD:${{ github.event.repository.default_branch }}
