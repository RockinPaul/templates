  - name: QwenPaw
    template_repo: RockinPaul/qwenpaw_railway_template
    deploy_url: https://railway.com/deploy/qwenpaw-1
    notes: "Thin wrapper over upstream's own multi-arch image, used unmodified - only env vars and an entrypoint. Requires a login upstream leaves optional, and deliberately runs NO relay, because QwenPaw skips auth for 127.0.0.1/::1 and an in-container proxy would silently disable the login (measured 200 via relay vs 401 direct). Rebinding to :: was tried and reverted, since Python sets IPV6_V6ONLY and Railway's public proxy is IPv4. Auto-registration variables are write-once, and so is the agent language: upstream defaults to zh with no env var and no init flag, and its non-interactive init copies persona files with skip_existing=True, so the wrapper seeds config.json and runs init itself before handing off (QWENPAW_AGENT_LANGUAGE, default en). Apache-2.0. See guide §5.31."
    upstreams:
      - name: qwenpaw image
        repo: agentscope-ai/QwenPaw
        kind: tag
        tag_formats: ["v{version}"]
        tag_pattern: '^v\d+\.\d+\.\d+$'
        pins:
          - file: Dockerfile
            pattern: '^ARG\s+QWENPAW_VERSION=(?P<version>[\w.-]+)'
        relevant_paths:
          - "deploy/Dockerfile"
          - "deploy/entrypoint.sh"
          - "deploy/config/supervisord.conf.template"
          - "src/qwenpaw/app/auth.py"
          - "src/qwenpaw/local_models/manager.py"
          - "src/qwenpaw/local_models/llamacpp.py"
          - "website/public/docs/security.en.md"
          - "website/public/docs/models.en.md"
          - "LICENSE"
  - name: ReMe
    template_repo: RockinPaul/reme_railway_template
    deploy_url: https://railway.com/deploy/reme
    notes: "First template with NO upstream image (ReMe ships only a pip package) and NO upstream authentication - upstream states the service layer has none, CORS allows any origin, jobs may write/move/delete files, and instructs users to place it behind an authenticated reverse proxy rather than exposing it directly. So Caddy holds a generated bcrypt credential as the only public listener while ReMe keeps its default 127.0.0.1 bind and service.host=0.0.0.0 is never set. All 149 resolved packages are hash-pinned in requirements.lock because without an upstream image a rebuild is a fresh resolution; regenerate on linux/amd64. reme-ai declares reme_studio with no version constraint, so the lock is what stops the UI drifting. Apache-2.0. See guide §5.32."
    upstreams:
      - name: reme-ai package
        repo: agentscope-ai/ReMe
